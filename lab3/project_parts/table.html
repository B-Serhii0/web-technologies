<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Завдання 1. Таблиця</title>
  <style type="text/css">
    body { text-align: center; }
    table { border-collapse: collapse; width: 400px; margin: 0 auto; }
    td { border: 2px solid #000; }
    tr { height: 50px; }
  </style>
</head>
<body>
  <h1>Завдання 1</h1>
  <table>
    <tr>
      <td bgcolor="#2effd4" colspan="8"><br/></td>
    </tr>
    <tr>
      <td bgcolor="#ffffd0" rowspan="6"><br/></td>
      <td bgcolor="#2effd4" colspan="6"><br/></td>
      <td bgcolor="#ffffd0" rowspan="6"><br/></td>
    </tr>
    <tr>
      <td bgcolor="#ffffd0" rowspan="4"><br/></td>
      <td bgcolor="#2effd4" colspan="4"><br/></td>
      <td bgcolor="#ffffd0" rowspan="4"><br/></td>
    </tr>
    <tr>
      <td bgcolor="#ffffd0" rowspan="2"><br/></td>
      <td bgcolor="#ff1020"><br/></td>
      <td bgcolor="#1030ff"><br/></td>
      <td bgcolor="#ffffd0" rowspan="2"><br/></td>
    </tr>
    <tr>
      <td bgcolor="#28ff30"><br/></td>
      <td bgcolor="#ffff40"><br/></td>
    </tr>
    <tr>
      <td bgcolor="#2effd4" colspan="4"><br/></td>
    </tr>
    <tr>
      <td bgcolor="#2effd4" colspan="6"><br/></td>
    </tr>
    <tr>
      <td bgcolor="#2effd4" colspan="8"><br/></td>
    </tr>
  </table>
  <p><a href="../index.html">Повернутись на головну</a></p>
</body>
</html>
