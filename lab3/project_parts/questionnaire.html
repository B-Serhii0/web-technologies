<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Завдання 4. Анкета</title>
  <style>
    body { text-align: center; font-family: sans-serif; }
    form { display: inline-block; text-align: left; width: 480px; }
    fieldset { margin-bottom: 15px; }
    label { display: block; margin-top: 6px; }
    label.inline { display: inline; }
  </style>
</head>
<body>
  <h1>Анкета</h1>
  <form action="questionnaire.html" method="get">
    <fieldset>
      <legend>Особисті дані</legend>
      <label for="fname">Ім'я:</label>
      <input type="text" id="fname" name="fname" value="" placeholder="Введіть ім'я" required tabindex="1">
      <label for="lname">Прізвище:</label>
      <input type="text" id="lname" name="lname" value="" placeholder="Введіть прізвище" required tabindex="2">
      <label for="bday">Дата народження:</label>
      <input type="date" id="bday" name="bday" value="" tabindex="3">
      <label for="about">Про себе:</label>
      <textarea id="about" name="about" rows="3" cols="30" placeholder="Кілька слів про себе" tabindex="4"></textarea>
    </fieldset>

    <fieldset>
      <legend>Контакти та акаунт</legend>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" value="" placeholder="name@example.com" autocomplete="off" required
             pattern="[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}" tabindex="5">
      <label for="tel">Мобільний:</label>
      <input type="tel" id="tel" name="tel" value="" placeholder="+380501234567" required
             pattern="\+380\d{9}" title="Формат: +380XXXXXXXXX" tabindex="6">
      <label for="pass">Пароль:</label>
      <input type="password" id="pass" name="pass" value="" placeholder="6 символів: A-Z, a-z, 0-9" required
             pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{6}" title="Рівно 6 символів: велика і мала літера та цифра" tabindex="7">
    </fieldset>

    <fieldset>
      <legend>Вибір</legend>
      <p>Стать:</p>
      <input type="radio" id="g1" name="gender" value="male" tabindex="8"><label class="inline" for="g1">Чоловіча</label>
      <input type="radio" id="g2" name="gender" value="female" tabindex="9"><label class="inline" for="g2">Жіноча</label>
      <input type="radio" id="g3" name="gender" value="other" tabindex="10"><label class="inline" for="g3">Інше</label>

      <p>Форма навчання:</p>
      <input type="radio" id="s1" name="study" value="full" tabindex="11"><label class="inline" for="s1">Денна</label>
      <input type="radio" id="s2" name="study" value="part" checked tabindex="12"><label class="inline" for="s2">Заочна</label>
      <input type="radio" id="s3" name="study" value="dist" tabindex="13"><label class="inline" for="s3">Дистанційна</label>

      <p>Хобі:</p>
      <input type="checkbox" id="h1" name="hobby" value="sport" tabindex="14"><label class="inline" for="h1">Спорт</label>
      <input type="checkbox" id="h2" name="hobby" value="music" tabindex="15"><label class="inline" for="h2">Музика</label>
      <input type="checkbox" id="h3" name="hobby" value="games" tabindex="16"><label class="inline" for="h3">Ігри</label>
      <input type="checkbox" id="h4" name="hobby" value="travel" tabindex="17"><label class="inline" for="h4">Подорожі</label>
    </fieldset>

    <fieldset>
      <legend>Списки</legend>
      <label for="course">Курс:</label>
      <select id="course" name="course" tabindex="18">
        <option value="1">1</option><option value="2">2</option><option value="3" selected>3</option>
        <option value="4">4</option><option value="5">5</option>
      </select>

      <label for="langs">Мови програмування (Ctrl + клік):</label>
      <select id="langs" name="langs" multiple size="6" tabindex="19">
        <option value="java">Java</option><option value="py">Python</option><option value="js">JavaScript</option>
        <option value="cs">C#</option><option value="cpp">C++</option><option value="go">Go</option>
      </select>

      <label for="fav">Улюблене:</label>
      <select id="fav" name="fav" tabindex="20">
        <optgroup label="Фрукти">
          <option value="apple">Яблуко</option><option value="pear">Груша</option><option value="plum">Слива</option>
        </optgroup>
        <optgroup label="Овочі">
          <option value="tomato">Помідор</option><option value="cucumber">Огірок</option><option value="carrot">Морква</option>
        </optgroup>
        <optgroup label="Напої">
          <option value="tea">Чай</option><option value="coffee">Кава</option><option value="juice">Сік</option>
        </optgroup>
        <optgroup label="Десерти">
          <option value="cake">Торт</option><option value="ice">Морозиво</option><option value="pie">Пиріг</option>
        </optgroup>
      </select>

      <label for="city">Місто:</label>
      <input list="cities" id="city" name="city" value="" placeholder="Почніть вводити" tabindex="21">
      <datalist id="cities">
        <option value="Київ"><option value="Львів"><option value="Чернівці"><option value="Одеса"><option value="Харків">
      </datalist>
    </fieldset>

    <fieldset>
      <legend>Файли</legend>
      <label for="audio">Аудіофайли:</label>
      <input type="file" id="audio" name="audio" accept="audio/*" multiple tabindex="22">
    </fieldset>

    <input type="submit" value="Надіслати" tabindex="23">
    <input type="reset" value="Скинути" tabindex="24">
  </form>
  <p><a href="../index.html">Повернутись на головну</a></p>
</body>
</html>
